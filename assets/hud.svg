<circle cx="34" cy="36" r="6" fill="#00ff66"><animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/></circle><line x1="240" y1="12" x2="240" y2="60" stroke="#1d2f22" stroke-width="1"/><rect x="240" y="0" width="240" height="72" fill="none"/>
<text x="264" y="28" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" fill="#7d9484">CLEARANCE</text>

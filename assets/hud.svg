<line x1="480" y1="12" x2="480" y2="60" stroke="#1d2f22" stroke-width="1"/><rect x="480" y="0" width="240" height="72" fill="none"/>
<text x="504" y="28" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" fill="#7d9484">MISSION</text>
<text x="504" y="54" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#e6f5ea">OSCP+ // PHASE 0</text>
<line x1="720" y1="12" x2="720" y2="60" stroke="#1d2f22" stroke-width="1"/><rect x="720" y="0" width="240" height="72" fill="none"/>

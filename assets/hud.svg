<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="System status">
<rect width="1200" height="72" fill="#070b08" stroke="#1d2f22" stroke-width="1.5"/>
<rect x="0" y="0" width="240" height="72" fill="none"/>
